[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --color=yes
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires external tools)
    slow: Slow tests (>1 minute runtime)
    network: Tests requiring network access
    slurm: Tests requiring SLURM access

# Ignore patterns
norecursedirs = .git .venv venv env __pycache__ *.egg-info build dist

# Coverage options (if using pytest-cov)
# addopts = --cov=scgeo --cov-report=html --cov-report=term
