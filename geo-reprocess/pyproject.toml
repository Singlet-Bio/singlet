[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-geo"
version = "1.1.0"
description = "HPC-native toolkit for building single-cell RNA-seq catalogs from GEO and reprocessing FASTQs at scale with simpleaf/alevin-fry"
readme = "README.md"
authors = [
    {name = "Zach DeBruine", email = "debruinz@gvsu.edu"},
]
license = {text = "GPL-3.0-or-later"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
]
keywords = ["single-cell", "RNA-seq", "GEO", "bioinformatics", "genomics", "simpleaf", "alevin-fry", "SLURM", "HPC"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.285",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://singlet-ai.github.io/geo-reprocess/"
Documentation = "https://singlet-ai.github.io/geo-reprocess/"
Repository = "https://github.com/Singlet-AI/geo-reprocess"
Issues = "https://github.com/Singlet-AI/geo-reprocess/issues"

[project.scripts]
sc-geo = "scgeo.cli.main:main"

[tool.setuptools]
packages = {find = {where = ["."], include = ["scgeo*"], exclude = ["tests*", "examples*", "archive*"]}}

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=scgeo --cov-report=term-missing"
