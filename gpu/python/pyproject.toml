# SPDX-License-Identifier: GPL-2.0-or-later
# singlet-gpu Python wheel — PEP 517 build via scikit-build-core + CMake.
# Runtime: CUDA 12.x, cupy-cuda12x ≥ 13.0, numpy.
# Optional: anndata for read_anndata / to_anndata helpers.

[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "singlet-gpu"
version = "0.1.0"
description = "GPU-native single-cell analysis — zero-copy .1pz reader and analysis kernels"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"
keywords = ["single-cell", "GPU", "CUDA", "scRNA-seq", "sparse-matrix"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "cupy-cuda12x>=13.0,<15",
    "numpy>=1.24,<2.6",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10,<0.13"]
scanpy  = ["scanpy>=1.10,<1.12", "anndata>=0.10,<0.13"]
dev     = ["pytest>=7.0", "scipy>=1.11,<1.18"]

[project.urls]
Homepage   = "https://github.com/zdebruine/Singlet-AI"
Repository = "https://github.com/zdebruine/Singlet-AI"

# ---------------------------------------------------------------------------
# scikit-build-core CMake settings
# ---------------------------------------------------------------------------
[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = [
    # Parent singlet-gpu tree is the source of truth for headers.
    # The python/ subdirectory CMakeLists.txt delegates upward.
    "-DSINGLET_GPU_BUILD_PYTHON=ON",
    "-DSINGLET_GPU_BUILD_TESTS=OFF",
    "-DSINGLET_GPU_BUILD_BENCH=OFF",
]
# Only install the singlet_gpu Python package, not the C++ test/bench targets.
install.components = ["python"]
wheel.packages = ["singlet_gpu"]
# Enforce pybind11 visibility flag via CMake (also set in CMakeLists.txt).
cmake.verbose = false

[tool.pytest.ini_options]
testpaths = ["tests"]
