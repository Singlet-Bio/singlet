name: Build and deploy documentation

# Builds the R pkgdown site (r/) and the Python Sphinx site (docs-python/)
# and publishes both together to GitHub Pages, under /r/ and /python/
# respectively, plus a small landing page at the site root. Building and
# deploying both in one workflow avoids two independent jobs racing to
# publish the same gh-pages branch.

on:
  push:
    branches: [main]
    paths:
      - "r/**"
      - "python/**"
      - "docs-python/**"
      - "include/singlet/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-r-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = TRUE)'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-docs
          path: r/docs
          retention-days: 1

  build-python-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system zstd (native extension build dependency)
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev

      - name: Install singlet + docs dependencies
        run: |
          pip install -e .
          pip install -r docs-python/requirements.txt

      - name: Build Sphinx site
        run: sphinx-build -b html docs-python docs-python/_build/html

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-docs
          path: docs-python/_build/html
          retention-days: 1

  assemble-and-deploy:
    needs: [build-r-docs, build-python-docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download R docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r-docs
          path: site/r

      - name: Download Python docs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-docs
          path: site/python

      - name: Build landing page
        run: |
          cat > site/index.html << 'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>singlet documentation</title>
            <style>
              body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                     max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #1a1a1a; }
              h1 { margin-bottom: 0.25rem; }
              p.tagline { color: #555; margin-top: 0; }
              .cards { display: grid; gap: 1rem; margin-top: 2rem; }
              a.card { display: block; padding: 1.25rem 1.5rem; border: 1px solid #ddd; border-radius: 10px;
                        text-decoration: none; color: inherit; }
              a.card:hover { border-color: #888; }
              a.card h2 { margin: 0 0 0.25rem; font-size: 1.1rem; }
              a.card p { margin: 0; color: #555; font-size: 0.95rem; }
              footer { margin-top: 3rem; font-size: 0.85rem; color: #888; }
              footer a { color: inherit; }
            </style>
          </head>
          <body>
            <h1>singlet</h1>
            <p class="tagline">An open single-cell RNA-seq atlas.</p>
            <div class="cards">
              <a class="card" href="python/">
                <h2>Python client &rarr;</h2>
                <p>API reference and install docs for the <code>singlet</code> package on PyPI.</p>
              </a>
              <a class="card" href="r/">
                <h2>R client &rarr;</h2>
                <p>Function reference and articles for the <code>singlet</code> R package.</p>
              </a>
            </div>
            <footer>
              <a href="https://github.com/Singlet-Bio/singlet">GitHub</a> &middot;
              <a href="https://singlet.bio">Data catalog</a>
            </footer>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
