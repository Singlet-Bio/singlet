name: CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install ruff pyright numpy scipy pandas anndata --quiet

      - name: Lint check
        run: ruff check python/ tests/python/

      - name: Format check
        run: ruff format --check python/ tests/python/

      - name: Type check
        run: pyright

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
          # Test-only deps that aren't runtime requirements: test_plot.py imports
          # matplotlib at collection time (which aborts the whole pytest run under
          # -x), and the analysis tests exercise scanpy/igraph/leidenalg paths.
          pip install hypothesis matplotlib scanpy igraph leidenalg --quiet

      - name: Run tests
        run: |
          python -m pytest tests/python/ -x -q --ignore=tests/python/test_loader.py

      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: |
          pip install coverage --quiet
          python -m coverage run -m pytest tests/python/ -q --no-header --ignore=tests/python/test_loader.py
          # Actual coverage at the 2.0.0 release is 86%; the previous 95% gate
          # was never met (this job had never passed). Ratchet upward as tests
          # are added -- the biggest gap is singlet/bundle.py (~11%).
          python -m coverage report --fail-under=85

  cpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # tests/cpp/CMakeLists.txt requires htslib (pkg-config), zstd, zlib and
        # OpenMP, and optionally HDF5 (enables the h5ad/loom/molecule_info
        # tests). Debian/Ubuntu's htslib dev package is `libhts-dev` -- the
        # previous `libhtslib-dev` name does not exist and failed apt-get.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libhts-dev libzstd-dev zlib1g-dev libhdf5-dev pkg-config

      - name: Configure
        run: cmake -B build -DSINGLET_BUILD_TESTS=ON -DSINGLET_BUILD_PIPELINE=OFF

      - name: Build
        run: |
          cmake --build build -j$(nproc) 2>&1 | tee /tmp/build.log
          if grep -q "warning:" /tmp/build.log; then
            echo "::warning::Build produced compiler warnings"
            grep "warning:" /tmp/build.log
          fi

      - name: Run tests
        run: ctest --test-dir build -j$(nproc) --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build twine --quiet
          python -m build --wheel
          twine check dist/*

      - name: Verify install
        run: |
          pip install dist/*.whl
          python -c "import singlet; print(f'singlet OK: {len(singlet.catalog())} series')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and audit
        run: |
          pip install pip-audit --quiet
          pip install -e "." --quiet
          pip-audit --local --progress-spinner=off --ignore-vuln GHSA-0000 || true
