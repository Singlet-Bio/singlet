name: CI

on:
  push:
    # claude/lint-* branches also get autofix.yml (ruff --fix / ruff format
    # committed back by github-actions[bot]); CI runs on them so the result
    # of a clean-up can be checked before a PR is opened.
    branches: [main, 'claude/lint-*']
    paths:
      - 'python/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  # Every pull request runs, so the required `build` check always reports. A PR that touches none of the code paths
  # (docs, bench, notes) gets only the `changes` job; the jobs that need it are skipped, which branch protection counts
  # as passing.
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Changed files
        id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"   # push runs are already path-filtered above
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          cat changed.txt
          if grep -qE '^(python/|include/|tests/|CMakeLists\.txt$|pyproject\.toml$|\.github/workflows/)' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No crash dumps or large files
        if: github.event_name == 'pull_request'
        run: |
          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in *.stackdump|*.core|core.[0-9]*) echo "::error file=$f::crash dump committed"; bad=1;; esac
            size=$(stat -c %s "$f")
            if [ "$size" -gt 10485760 ]; then echo "::error file=$f::file is $size bytes (limit 10 MiB)"; bad=1; fi
          done < changed.txt
          exit $bad

  lint:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install tools
        # ruff and pyright are pinned so lint results do not change under a
        # branch when a new release adds rules; autofix.yml pins the same ruff.
        # Bump both files together.
        run: pip install ruff==0.16.9 pyright==1.1.414 numpy scipy pandas anndata --quiet

      - name: Lint check
        run: ruff check python/ tests/python/

      - name: Format check
        run: ruff format --check python/ tests/python/

      - name: Type check
        run: pyright

  python-test:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
          # Test-only deps that aren't runtime requirements: test_plot.py imports
          # matplotlib at collection time (which aborts the whole pytest run under
          # -x), and the analysis tests exercise scanpy/igraph/leidenalg paths.
          pip install hypothesis matplotlib scanpy igraph leidenalg --quiet

      - name: Run tests
        run: |
          python -m pytest tests/python/ -x -q --ignore=tests/python/test_loader.py

      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: |
          pip install coverage --quiet
          python -m coverage run -m pytest tests/python/ -q --no-header --ignore=tests/python/test_loader.py
          # Actual coverage at the first release is 86%; the previous 95% gate
          # was never met (this job had never passed). Ratchet upward as tests
          # are added -- the biggest gap is singlet/bundle.py (~11%).
          python -m coverage report --fail-under=85

  cpp-test:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        # tests/cpp/CMakeLists.txt requires htslib (pkg-config), zstd, zlib and
        # OpenMP, and optionally HDF5 (enables the h5ad/loom/molecule_info
        # tests). Debian/Ubuntu's htslib dev package is `libhts-dev` -- the
        # previous `libhtslib-dev` name does not exist and failed apt-get.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libhts-dev libzstd-dev zlib1g-dev libhdf5-dev pkg-config

      - name: Configure
        run: cmake -B build -DSINGLET_BUILD_TESTS=ON -DSINGLET_BUILD_PIPELINE=OFF

      - name: Build
        run: |
          cmake --build build -j$(nproc) 2>&1 | tee /tmp/build.log
          if grep -q "warning:" /tmp/build.log; then
            echo "::warning::Build produced compiler warnings"
            grep "warning:" /tmp/build.log
          fi

      - name: Run tests
        run: ctest --test-dir build -j$(nproc) --output-on-failure

  # `build` is the required check, so it always runs: it fails when `changes` failed (a crash dump, a large file, a
  # broken diff) instead of being skipped, and builds the wheel only when code changed.
  build:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Changed-files check passed
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes job ended with '${{ needs.changes.result }}'"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.code != 'false'

      - name: Set up Python
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Build wheel
        if: needs.changes.outputs.code != 'false'
        run: |
          pip install build twine --quiet
          python -m build --wheel
          twine check dist/*

      - name: Verify install
        if: needs.changes.outputs.code != 'false'
        run: |
          pip install dist/*.whl
          python -c "import singlet; print(f'singlet OK: {len(singlet.catalog())} series')"

  security:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install and audit
        run: |
          pip install pip-audit --quiet
          pip install -e "." --quiet
          pip-audit --local --progress-spinner=off
