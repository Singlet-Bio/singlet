name: CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install ruff pyright numpy scipy pandas anndata --quiet

      - name: Lint check
        run: ruff check python/ tests/python/

      - name: Format check
        run: ruff format --check python/ tests/python/

      - name: Type check
        run: pyright

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
          pip install hypothesis --quiet

      - name: Run tests
        run: |
          python -m pytest tests/python/ -x -q --ignore=tests/python/test_loader.py

      - name: Coverage report
        if: matrix.python-version == '3.12'
        run: |
          pip install coverage --quiet
          python -m coverage run -m pytest tests/python/ -q --no-header --ignore=tests/python/test_loader.py
          python -m coverage report --fail-under=95

  cpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        # htslib/HDF5/pkg-config are only needed when SINGLET_BUILD_PIPELINE=ON
        # (see CMakeLists.txt) -- this job builds with pipeline OFF, so it only
        # needs zstd and zlib, which is what CMakeLists.txt's top-level
        # find_package(ZLIB REQUIRED) / find_library(zstd) actually check for.
        # (libhtslib-dev also isn't a real Ubuntu/Debian apt package name --
        # the htslib dev package there is libhts-dev -- so keeping it here
        # unconditionally would fail apt-get regardless of whether it's needed.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libzstd-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -DSINGLET_BUILD_TESTS=ON -DSINGLET_BUILD_PIPELINE=OFF

      - name: Build
        run: |
          cmake --build build -j$(nproc) 2>&1 | tee /tmp/build.log
          if grep -q "warning:" /tmp/build.log; then
            echo "::warning::Build produced compiler warnings"
            grep "warning:" /tmp/build.log
          fi

      - name: Run tests
        run: ctest --test-dir build -j$(nproc) --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel
        run: |
          pip install build twine --quiet
          python -m build --wheel
          twine check dist/*

      - name: Verify install
        run: |
          pip install dist/*.whl
          python -c "import singlet; print(f'singlet OK: {len(singlet.catalog())} series')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and audit
        run: |
          pip install pip-audit --quiet
          pip install -e "." --quiet
          pip-audit --local --progress-spinner=off --ignore-vuln GHSA-0000 || true
