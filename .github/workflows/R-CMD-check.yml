name: R CMD check

# MVP_ROADMAP.md BLOCKER #6.
# Runs R CMD check --as-cran on the r/ package across Linux/macOS/Windows and
# R release+devel. Required for CRAN submission.

on:
  push:
    branches: [main]
    paths:
      - "r/**"
      - "include/singlet/**"
      - ".github/workflows/R-CMD-check.yml"
  pull_request:
    paths:
      - "r/**"
      - "include/singlet/**"
      - ".github/workflows/R-CMD-check.yml"
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: "release" }
          - { os: ubuntu-latest,  r: "devel"   }
          - { os: macos-latest,   r: "release" }
          - { os: windows-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    defaults:
      run:
        working-directory: r

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # The r/src/pz_io.cpp binding links against system zstd. Ubuntu's
      # runners get it automatically via setup-r-dependencies' Linux
      # system-requirements resolution, and Windows via the Rtools/rwinlib
      # toolchain, but macOS has no equivalent -- install it explicitly.
      #
      # `brew install` alone isn't sufficient: Homebrew's prefix
      # (/opt/homebrew on arm64, /usr/local on x86_64) isn't on the
      # compiler's default search path, and src/Makevars' static
      # `PKG_LIBS = -lzstd` has no matching `-L`/`-I` for it. Export
      # CPPFLAGS/LDFLAGS to the rest of the job so R's build (which merges
      # them into ALL_CPPFLAGS/the link line alongside the package's own
      # PKG_CPPFLAGS/PKG_LIBS) can find zstd.h and libzstd.
      - name: Install zstd (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          echo "CPPFLAGS=-I$(brew --prefix zstd)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix zstd)/lib" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Regenerate NAMESPACE + man pages
        run: Rscript -e 'devtools::document()'

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          upload-snapshots: true
          args: 'c("--as-cran", "--no-manual")'
