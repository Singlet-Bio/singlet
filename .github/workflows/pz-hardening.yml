name: .1pz reader hardening

on:
  push:
    branches: [main]
    paths:
      - 'include/singlet/pileup/pz_*.h'
      - 'r/inst/include/**'
      - 'tests/cpp/test_pz_*.cpp'
      - 'tests/fuzz/**'
      - 'scripts/sync_r_headers.py'
      - '.github/workflows/pz-hardening.yml'
  pull_request:
    branches: [main]
    paths:
      - 'include/singlet/pileup/pz_*.h'
      - 'r/inst/include/**'
      - 'tests/cpp/test_pz_*.cpp'
      - 'tests/fuzz/**'
      - 'scripts/sync_r_headers.py'
      - '.github/workflows/pz-hardening.yml'

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd and clang
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev clang

      - name: R header copies match the C++ headers
        run: python3 scripts/sync_r_headers.py --check

      - name: Build reader tests with ASan + UBSan
        run: |
          for t in test_pz_reader test_pz_hardening; do
            clang++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
              -fsanitize=address,undefined -fno-sanitize-recover=undefined \
              -Iinclude tests/cpp/$t.cpp -lzstd -o $t
          done

      - name: Run reader tests
        run: |
          ./test_pz_reader
          ./test_pz_hardening

      - name: Fuzz the reader for 60 seconds
        run: |
          clang++ -std=c++17 -O1 -g -fsanitize=fuzzer,address,undefined \
            -fno-sanitize-recover=undefined -Iinclude \
            tests/fuzz/fuzz_pz_reader.cpp -lzstd -o fuzz_pz_reader
          mkdir -p corpus
          ./fuzz_pz_reader corpus -max_total_time=60 -max_len=65536 -timeout=10

  windows:
    # The same reader tests under MSVC: proves the codec builds and runs on Windows
    # (narrow-path handling, no POSIX-only calls, temp files under %TEMP%).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: vcpkg install zstd:x64-windows

      - name: Build and run the reader tests
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          set Z=C:\vcpkg\installed\x64-windows
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /I include /I %Z%\include tests\cpp\test_pz_reader.cpp /Fe:test_pz_reader.exe /link /LIBPATH:%Z%\lib zstd.lib || exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /utf-8 /I include /I %Z%\include tests\cpp\test_pz_hardening.cpp /Fe:test_pz_hardening.exe /link /LIBPATH:%Z%\lib zstd.lib || exit /b 1
          copy /Y %Z%\bin\zstd.dll . >nul
          test_pz_reader.exe || exit /b 1
          test_pz_hardening.exe || exit /b 1
