name: Build binary wheels (cibuildwheel)

# MVP_ROADMAP.md BLOCKER #5.
# Builds manylinux + macOS wheels (Linux x86_64/aarch64, macOS x86_64/arm64).
# Triggered by tags v* (the publish-pypi.yml workflow picks up the resulting
# wheel artifacts). Also runs on push to main as a smoke build (no publish).
#
# Wheels include the compiled .1pz extension (`_pz.so`) and the bundled zstd.
# `auditwheel`/`delocate` is run by cibuildwheel automatically.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/bindings/**"
      - "include/singlet/pz/**"
      - "include/singlet/fq/**"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

jobs:
  build_wheels:
    name: ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          - { os: macos-13, arch: x86_64 }
          - { os: macos-14, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU (Linux aarch64 fallback)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # Skip pypy + musllinux for MVP. CPython 3.9–3.13 on manylinux/macOS.
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *-musllinux_*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # The `singlet._pz` extension links against system zstd
          # (`setup.py`: `libraries=["zstd"]`). Neither the manylinux2014
          # containers nor the macOS runners ship the zstd headers/library,
          # so install them before the extension is compiled; auditwheel /
          # delocate then bundle the shared library into the wheel as usual.
          CIBW_BEFORE_ALL_LINUX: "(yum install -y zstd-devel || (yum install -y epel-release && yum install -y libzstd-devel)) 2>/dev/null || (apt-get update && apt-get install -y libzstd-dev)"
          CIBW_BEFORE_ALL_MACOS: "brew install zstd"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "python -c 'import singlet; print(singlet.__version__)'"
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          retention-days: 7
