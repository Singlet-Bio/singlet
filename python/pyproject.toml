[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "singlet-bio"
version = "1.3.4"
description = "Python client for the Singlet single-cell atlas — 4,525 samples, 5.5M cells, 8 species, 40 cell types, 11 MCP tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Zach DeBruine", email = "debruinz@gvsu.edu"},
    {name = "SingletAI"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["single-cell", "RNA-seq", "bioinformatics", "sparse-matrix", "pytorch", "anndata", "singlepress"]

dependencies = [
    "anndata>=0.8",
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "requests>=2.25",
    "tqdm>=4.60",
]

[project.optional-dependencies]
torch = ["torch>=1.12"]
zarr = ["zarr>=2.12"]
tiledb = ["tiledbsoma>=1.4"]
mcp = ["mcp>=0.1", "supabase>=2.0"]
docs = [
    "sphinx>=5.0",
    "furo",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "ipykernel",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-benchmark",
    "torch>=1.12",
    "zarr>=2.12",
    "pybind11>=2.11",
]
all = [
    "singlet[torch]",
    "singlet[zarr]",
    "singlet[tiledb]",
]

[project.urls]
Homepage = "https://singlet.bio"
Documentation = "https://singlet.bio/atlas-docs"
Repository = "https://github.com/Singlet-Bio/singlet"
Issues = "https://github.com/Singlet-Bio/singlet/issues"
Changelog = "https://github.com/Singlet-Bio/singlet/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["singlet*"]
exclude = ["_old_toplevel*", "tests*"]

[tool.setuptools.package-data]
singlet = ["data/*.parquet"]

[project.scripts]
singlet-mcp = "singlet.mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
