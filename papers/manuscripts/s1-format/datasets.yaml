# Benchmark panel for the .s1 manuscript: 29 public datasets in common use, 31 count matrices.
#
# Selection rules
#   * Already distributed as a count matrix (no realignment): we test the storage format, not a pipeline.
#   * Spread over protocol classes (droplet 3'/5'/probe, other droplet, combinatorial indexing, plate with UMIs,
#     plate with read counts, sequencing-based spatial, imaging-based spatial, multimodal) and over size tiers
#     S (< 20k cells), M (20k-200k), L (200k-2M), XL (> 2M).
#   * Widely reused (tutorials, benchmarks, atlases), so readers recognise them and can check our numbers.
#
# Nothing here has been downloaded. Sizes are approximate, from the source papers and portals.
# `verify: true` means the exact file URL or the file name inside the record must be confirmed on the portal
# before fetching; the fetch stage refuses an entry whose url is null. After the first successful fetch,
# record `sha256` and `bytes` here (fetch.py prints them) so every later run is checked against them.
#
# `matrices` lists every count matrix taken from a dataset. Each becomes one benchmark unit. The value field says
# what the integers are: umi (molecule counts), reads (read counts, non-UMI protocols), transcripts (imaging spots
# assigned to cells), fragments (ATAC insertions), adt (antibody-derived tag UMIs).
# `x_location` tells canon.py where the raw integer counts are inside an h5ad (X, raw/X or layers/<name>).
#
# `loader_panel: true` marks the five datasets used for the time-to-minibatch and network experiments (Fig. 1b, 1d),
# chosen to span S to XL and droplet, plate and combinatorial data. Every dataset is used for size, decode, ladder, floor and second-pass experiments.

