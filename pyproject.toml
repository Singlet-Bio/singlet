[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "singlet"
version = "1.0.0"
description = "Single-cell genomics: load, analyze, and process single-cell data at scale"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Zach DeBruine", email = "debruinz@gvsu.edu"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["single-cell", "RNA-seq", "bioinformatics", "sparse-matrix", "pytorch", "anndata", "GPU"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "requests>=2.25",
    "tqdm>=4.60",
    "scikit-learn>=1.0",
    "zstandard>=0.20",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
gpu = ["cupy-cuda12x>=13.0"]
zarr = ["zarr>=2.12"]
tiledb = ["tiledbsoma>=1.4"]
mcp = ["mcp>=0.1"]
all = ["singlet[torch,gpu,zarr,tiledb,mcp]"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff",
    "pybind11>=2.11",
]

[project.urls]
Homepage = "https://singlet.bio"
Documentation = "https://singlet.bio/docs"
Repository = "https://github.com/Singlet-Bio/singlet"
Issues = "https://github.com/Singlet-Bio/singlet/issues"
Changelog = "https://github.com/Singlet-Bio/singlet/blob/main/CHANGELOG.md"

[project.scripts]
singlet = "singlet.mcp.__main__:main"
singlet-process = "singlet.pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["singlet*"]

[tool.setuptools.package-data]
singlet = ["data/*.parquet", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-v --tb=short"
markers = [
    "smoke: lightweight smoke tests for new features",
    "gpu: requires CUDA GPU and CuPy",
]
filterwarnings = [
    "ignore:Sparse CSR tensor support is in beta:UserWarning",
    "ignore::DeprecationWarning:pyiceberg",
    "ignore::DeprecationWarning:pyparsing",
    "ignore::DeprecationWarning:pydantic",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B017"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"python/singlet/gpu/__init__.py" = ["F401"]
"python/singlet/torch/__init__.py" = ["F401"]
"python/singlet/gpu/enrichment/gsea.py" = ["F401"]
"python/singlet/gpu/perturbation/*" = ["E741"]
"python/singlet/gpu/spatial/*" = ["E741"]
"tests/python/test_integration.py" = ["F401"]

[tool.coverage.run]
source = ["python/singlet"]
omit = [
    "python/singlet/gpu/*",
    "python/singlet/mcp/*",
    "python/singlet/torch/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
