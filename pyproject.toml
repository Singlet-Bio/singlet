[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is "singlet-bio": "singlet" on PyPI is an
# unrelated 2017 project (github.com/iosonofabio/singlet, Fabio Zanini).
# The import name is unchanged: `pip install singlet-bio`, then `import singlet`.
# Wheels and sdists are named singlet_bio-<version>-*.whl / singlet_bio-<version>.tar.gz.
name = "singlet-bio"
version = "2.0.0"
description = "Open single-cell RNA-seq atlas: find, load, and analyze single-cell data at scale"
readme = "python/README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Zach DeBruine", email = "debruinz@gvsu.edu"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
keywords = ["single-cell", "RNA-seq", "bioinformatics", "sparse-matrix", "pytorch", "anndata", "GPU"]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "anndata>=0.8",
    "requests>=2.25",
    "tqdm>=4.60",
    "scikit-learn>=1.0",
    "zstandard>=0.20",
    # No upper bound. (An earlier `<21` pin existed only because pyarrow 21+
    # ships manylinux_2_28 wheels rather than manylinux2014 ones, which broke
    # the wheel *test* container; wheels.yml now builds on manylinux_2_28, so
    # users are no longer held back from current pyarrow releases.)
    "pyarrow>=10.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
gpu = ["cupy-cuda12x>=13.0"]
zarr = ["zarr>=2.12"]
tiledb = ["tiledbsoma>=1.4"]
# The local MCP server is written against the 1.x SDK (mcp.server.Server).
mcp = ["mcp>=1.0,<2"]
# Optional algorithm packages some analysis functions use when present
# (plotting, scanpy interop, GLM-based tests, Leiden on igraph).
analysis = [
    "matplotlib>=3.5",
    "scanpy>=1.9",
    "statsmodels>=0.13",
    "igraph>=0.10",
    "leidenalg>=0.9",
]
all = ["singlet-bio[torch,gpu,zarr,tiledb,mcp,analysis]"]
# Everything the Python test suite imports.
test = [
    "pytest>=7.0",
    "pytest-cov",
    "coverage>=7.0",
    "hypothesis>=6.0",
    "singlet-bio[analysis]",
]
dev = [
    "singlet-bio[test]",
    "ruff",
    "pyright",
    "pybind11>=2.11",
]

[project.urls]
Homepage = "https://singlet.bio"
Documentation = "https://singlet.bio/docs"
Repository = "https://github.com/Singlet-Bio/singlet"
Issues = "https://github.com/Singlet-Bio/singlet/issues"
Changelog = "https://github.com/Singlet-Bio/singlet/blob/main/CHANGELOG.md"

[project.scripts]
# Local MCP server (offline catalog snapshot + live search). Distinct from the
# hosted endpoint at https://singlet.bio/mcp.
singlet-mcp = "singlet.mcp.__main__:main"
# Deprecated alias for singlet-mcp: "singlet" is also the C++ pipeline binary's
# name. Still works (prints a notice on stderr); pipeline/_binary.py skips it.
singlet = "singlet.mcp.__main__:deprecated_main"
singlet-process = "singlet.pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["singlet*"]

[tool.setuptools.package-data]
singlet = ["data/*.parquet", "data/whitelists/*.txt", "py.typed", "_singlepress*.so"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-v --tb=short"
markers = [
    "smoke: lightweight smoke tests for new features",
    "gpu: requires CUDA GPU and CuPy",
]
filterwarnings = [
    "ignore:Sparse CSR tensor support is in beta:UserWarning",
    "ignore::DeprecationWarning:pyiceberg",
    "ignore::DeprecationWarning:pyparsing",
    "ignore::DeprecationWarning:pydantic",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B017"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"python/singlet/gpu/__init__.py" = ["F401"]
"python/singlet/torch/__init__.py" = ["F401"]
"python/singlet/gpu/enrichment/gsea.py" = ["F401"]
"python/singlet/gpu/perturbation/*" = ["E741"]
"python/singlet/gpu/spatial/*" = ["E741"]
"tests/python/test_integration.py" = ["F401"]

[tool.coverage.run]
source = ["python/singlet"]
omit = [
    "python/singlet/gpu/*",
    "python/singlet/mcp/*",
    "python/singlet/torch/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true
